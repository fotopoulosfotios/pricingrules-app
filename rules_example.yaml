rules:
  - id: R001
    description: "Έλεγχος για έξοδα αποστολέα (OUR)"
    condition:
      field: "ChargeBearer"
      equals: "OUR"
    action: "Χρέωση αποστολέα για όλα τα έξοδα"

  - id: R002
    description: "Έλεγχος για έξοδα παραλήπτη (BEN)"
    condition:
      field: "ChargeBearer"
      equals: "BEN"
    action: "Χρέωση παραλήπτη για όλα τα έξοδα"

  - id: R003
    description: "Έλεγχος τύπου συναλλαγής και νομίσματος"
    condition:
      field: "Currency"
      in: ["EUR", "USD"]
    action: "Εφαρμογή κανόνων κόστους ανά νόμισμα"

  - id: R004
    description: "Ειδικός κανόνας για BIC CRBAGRAAXXX"
    condition:
      field: "BIC"
      equals: "CRBAGRAAXXX"
    action: "Πρόσθετη επιβάρυνση 0.10%"

  - id: R005
    description: "Έλεγχος ύψους ποσού"
    condition:
      field: "Amount"
      greater_than: 10000
    action: "Εφαρμογή premium handling fee"


