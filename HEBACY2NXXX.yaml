rules:
  - id: HEBA-1
    description: Χρέωση έως 1.000 EUR
    condition:
      field: Amount
      less_equal: 1000
    action:
      set_charge: 0.00

  - id: HEBA-2
    description: Χρέωση έως 10.000 EUR
    condition:
      field: Amount
      less_equal: 10000
    action:
      set_charge: 2.00

  - id: HEBA-3
    description: Χρέωση έως 50.000 EUR
    condition:
      field: Amount
      less_equal: 50000
    action:
      set_charge: 15.00

  - id: HEBA-4
    description: Χρέωση πάνω από 50.000 EUR
    condition:
      field: Amount
      greater_than: 50000
    action:
      set_charge: 30.00
